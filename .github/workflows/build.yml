name: Windows build
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build and test
        id: build_test
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Verify participant UI
        id: participant_ui
        shell: pwsh
        run: node scripts/browser-smoke.cjs
      - name: Record validation summary
        if: always()
        shell: pwsh
        env:
          BUILD_OUTCOME: ${{ steps.build_test.outcome }}
          UI_OUTCOME: ${{ steps.participant_ui.outcome }}
        run: |
          @(
            '## Participant validation'
            "Build and tests: $env:BUILD_OUTCOME"
            "Participant UI: $env:UI_OUTCOME"
            "Commit: $env:GITHUB_SHA; run: $env:GITHUB_RUN_ID; attempt: $env:GITHUB_RUN_ATTEMPT"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          if (Test-Path -LiteralPath 'artifacts/qa/browser/result.json') {
            '```json' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Get-Content -LiteralPath 'artifacts/qa/browser/result.json' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
      # Successful routine runs keep their result in the summary and job logs.
      # A manual run keeps screenshots for visual review, including on success.
      - name: Upload participant UI evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure() || cancelled() || github.event_name == 'workflow_dispatch'
        with:
          name: participant-ui-${{ github.sha }}
          path: artifacts/qa/browser/
          retention-days: 7
          if-no-files-found: ignore
